name: Validate translations

on:
  pull_request:
    paths:
      - 'translations/**/*.json'

jobs:
  validate-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate JSON syntax
        run: |
          python -c "
          import json, pathlib, sys
          bad = []
          for path in pathlib.Path('translations').glob('**/*.json'):
              try:
                  json.loads(path.read_text(encoding='utf-8'))
              except json.JSONDecodeError as e:
                  bad.append(f'{path}: {e}')
          if bad:
              print('\n'.join(bad))
              sys.exit(f'{len(bad)} file(s) with invalid JSON')
          print('all translation JSON files are valid')
          "
